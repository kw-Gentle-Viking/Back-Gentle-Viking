services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gentle-viking-backend
    env_file:
      - .env.gcp
    ports:
      - "8000:8000"
    depends_on:
      app-db:
        condition: service_healthy
      market-db:
        condition: service_healthy
      clickhouse:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  backtest-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gentle-viking-backtest-worker
    env_file:
      - .env.gcp
    command: uvicorn backtest.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    depends_on:
      market-db:
        condition: service_healthy
      clickhouse:
        condition: service_started
    restart: unless-stopped

  app-db:
    image: postgres:16
    container_name: app-db
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env.gcp}
    volumes:
      - app_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trading"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  market-db:
    image: timescale/timescaledb:latest-pg16
    container_name: market-db
    environment:
      POSTGRES_DB: market_data
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: ${MARKET_DB_PASSWORD:?set MARKET_DB_PASSWORD in .env.gcp}
    volumes:
      - market_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d market_data"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: feature-cache
    volumes:
      - redis_data:/data
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: analytics-db
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    restart: unless-stopped

volumes:
  app_data:
  market_data:
  redis_data:
  clickhouse_data:
